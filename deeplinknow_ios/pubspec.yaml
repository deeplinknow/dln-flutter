name: deeplinknow_ios
description: >-
  iOS implementation of the deeplinknow plugin. Wraps the native DeepLinkNow iOS SDK. Add
  `deeplinknow` to your app, not this package; it is endorsed and installed automatically.
version: 1.3.0
homepage: https://deeplinknow.com
documentation: https://deeplinknow.com/docs/flutter
repository: https://github.com/deeplinknow/dln-flutter/tree/main/deeplinknow_ios
issue_tracker: https://github.com/deeplinknow/dln-flutter/issues

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    implements: deeplinknow
    platforms:
      ios:
        pluginClass: DeepLinkNowPlugin
