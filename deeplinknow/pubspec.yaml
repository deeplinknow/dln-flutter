name: deeplinknow
description: >-
  Privacy-first deferred deep linking for Flutter. Wraps the native DeepLinkNow iOS and
  Android SDKs: one call to initialize, one call to get the link the user tapped before
  installing. No attribution, no ad tracking.
version: 1.4.2
homepage: https://deeplinknow.com
documentation: https://deeplinknow.com/docs/flutter
repository: https://github.com/deeplinknow/dln-flutter/tree/main/deeplinknow
issue_tracker: https://github.com/deeplinknow/dln-flutter/issues
topics:
  - deep-linking
  - deferred-deep-linking
  - universal-links
  - app-links
  - dynamic-links

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # iOS implementation (a separate package because a pod / Swift package named `deeplinknow`
  # collides with the native `DeepLinkNow` module on case-insensitive file systems, FLT-23).
  deeplinknow_ios: '>=1.4.2 <1.5.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.deeplinknow.flutter
        pluginClass: DeepLinkNowPlugin
      ios:
        default_package: deeplinknow_ios
